<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Jeky Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
        }

        .nav {
            margin-bottom: 24px;
        }

        .nav a {
            display: inline-block;
            padding: 10px 14px;
            background: #111;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            margin-right: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #555;
        }

        .number {
            font-size: 34px;
            font-weight: bold;
            margin: 0;
        }

        .waiting {
            border-left: 6px solid #f1c40f;
        }

        .accepted {
            border-left: 6px solid #3498db;
        }

        .progress {
            border-left: 6px solid #9b59b6;
        }

        .completed {
            border-left: 6px solid #27ae60;
        }

        .cancelled {
            border-left: 6px solid #c0392b;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>Dashboard Jeky Admin</h1>
<p class="subtitle">Ringkasan data layanan dan order Jeky.</p>

<div class="nav">
    <a th:href="@{/admin/dashboard}">Dashboard</a>
    <a th:href="@{/admin/layanan}">Kelola Layanan</a>
    <a th:href="@{/admin/orders}">Daftar Order</a>
</div>

<div class="grid">
    <div class="card">
        <h3>Total Layanan</h3>
        <p class="number" th:text="${totalLayanan}">0</p>
    </div>

    <div class="card">
        <h3>Total Order</h3>
        <p class="number" th:text="${totalOrder}">0</p>
    </div>

    <div class="card waiting">
        <h3>Waiting</h3>
        <p class="number" th:text="${waitingOrder}">0</p>
    </div>

    <div class="card accepted">
        <h3>Accepted</h3>
        <p class="number" th:text="${acceptedOrder}">0</p>
    </div>

    <div class="card progress">
        <h3>On Progress</h3>
        <p class="number" th:text="${onProgressOrder}">0</p>
    </div>

    <div class="card completed">
        <h3>Completed</h3>
        <p class="number" th:text="${completedOrder}">0</p>
    </div>

    <div class="card cancelled">
        <h3>Cancelled</h3>
        <p class="number" th:text="${cancelledOrder}">0</p>
    </div>
</div>

</body>
</html>
