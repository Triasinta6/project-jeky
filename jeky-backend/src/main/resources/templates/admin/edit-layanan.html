<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Layanan Jeky</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Edit Layanan</h1>
    <div class="card">
        <form th:action="@{/admin/layanan/{id}/update(id=${layanan.id})}" th:object="${layanan}" method="post">
            <label>Nama Layanan</label>
            <input type="text" th:field="*{nama}" required>

            <label>Deskripsi</label>
            <textarea th:field="*{deskripsi}"></textarea>

            <label>Harga Dasar</label>
            <input type="number" th:field="*{hargaDasar}">

            <label>
                <input type="checkbox" th:field="*{aktif}" style="width:auto;">
                Aktif
            </label>

            <br><br>

            <button type="submit">Update</button>

            <a th:href="@{/admin/layanan}">
                <button type="button" class="back">Kembali</button>
            </a>
        </form>
    </div>
</body>
</html>
